name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Check content, assets, and scripts
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package the visitor site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: check-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
